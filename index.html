<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
    	body{ background-color: #C8E8EC;}
    	footer {color: #82A9A0}
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">BMI Calculator</h1>
         <details ontoggle="message()">
        <summary>Instructions</summary>
        <i class="text-center text-primary">Rates your body mass & height according to factors such as your age and gender, depending on your healthy lifestyle.</i></details>
        <div class="card p-4">
            <form id="bmiForm">
                <div class="mb-3">
                    <label for="weight" class="form-label">Weight (kg)</label>
                    <input type="number" class="form-control" id="weight" placeholder="Enter your weight">
                </div>
                <div class="mb-3">
                    <label for="height" class="form-label">Height (m)</label>
                    <input type="number" class="form-control" id="height" placeholder="Enter your height">
                </div>
                <button type="button" class="btn btn-primary" onclick="calcBMI()">Calculate BMI</button>
            </form>
            <div class="mt-3">
                <h3 id="result"></h3>
            </div>
        </div>
    </div>

    <footer class="mt-4 bg-light text-center py-3">
    <p><strong>References:</strong></p>
    <p><a href="https://www.calculator.net/bmi-calculator.html" target="_blank">BMI Calculator</a></p>
    <p><a href="https://my.clevelandclinic.org/health/articles/9464-body-mass-index-bmi" target="_blank">Body Mass Index (BMI) - Cleveland Clinic</a></p>
    <p><a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/parseFloat" target="_blank">ParseFloat() - JavaScript | MDN</a></p>
</footer>


    <script>
        function calcBMI() {
            const weight = parseFloat(document.getElementById('weight').value);
            const height = parseFloat(document.getElementById('height').value);
            if (weight > 0 && height > 0) {
                const bmi = (weight / (height * height)).toFixed(2);
                document.getElementById('result').innerText = `Your BMI is ${bmi}`;
            } else {
                document.getElementById('result').innerText = 'Please enter a value.';
            }

    let bmi = weight / (height * height);
    let message;

    if (bmi < 18.5) {
        message = "Underweight";
    } else if (bmi >= 18.5 && bmi < 24.9) {
        message = "Healthy weight";
    } else if (bmi >= 25 && bmi < 29.9) {
        message = "Overweight";
    } else {
        message = "Obesity";
    }

    alert(`Your BMI is ${bmi.toFixed(2)} (${message}).`);
}
    </script>
</body>
</html>
